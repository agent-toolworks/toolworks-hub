<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toolworks Hub</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Toolworks Hub</h1>
    <span id="updated" class="muted"></span>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main>
    <div id="sources"></div>
    <section id="available" class="source" hidden>
      <header class="source-head"><h2>Not installed</h2></header>
      <ul id="available-list" class="available"></ul>
    </section>
  </main>
</body>
</html>
